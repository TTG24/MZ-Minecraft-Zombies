name: Publish MinecraftZombies

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-minecraftzombies
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'TTG24/MZ-Minecraft-Zombies' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # JDK 21 runs the Gradle daemon (Gradle 8.5 only runs on JVM <= 21).
      # The java toolchain (Java 25, required by paper-api 26.x) is resolved
      # by the Foojay plugin in settings.gradle, which downloads Temurin 25
      # without touching JAVA_HOME. Do NOT add a second setup-java step here:
      # it overwrites JAVA_HOME even with set-default: false and would make
      # the daemon run on an unsupported JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Read release version
        run: |
          version=$(sed -n "s/^[[:space:]]*version = '\([0-9][0-9.]*\)'[[:space:]]*$/\1/p" build.gradle)
          [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: bash ./gradlew --no-daemon build
      - name: Prepare checksum
        working-directory: Core/build/libs
        run: sha256sum "MinecraftZombies-${RELEASE_VERSION}.jar" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view "v${RELEASE_VERSION}" >/dev/null 2>&1; then
            # One-time correction explicitly replacing the original 1.1.1 release.
            if [[ "$RELEASE_VERSION" == '1.1.1' ]]; then
              tag_commit=$(gh api "repos/${GH_REPO}/git/ref/tags/v1.1.1" --jq '.object.sha')
              if [[ "$tag_commit" == 'ac73478a37cdb6b726d3a499ffba62ff2a599c1b' ]]; then
                gh release upload v1.1.1 --clobber \
                  Core/build/libs/MinecraftZombies-1.1.1.jar \
                  Core/build/libs/SHA256SUMS.txt
                gh release edit v1.1.1 --notes-file RELEASE_NOTES.md
                gh api --method PATCH "repos/${GH_REPO}/git/refs/tags/v1.1.1" \
                  -f sha="$RELEASE_COMMIT" -F force=true
                exit 0
              fi
            fi
            echo "Release v${RELEASE_VERSION} already exists; leaving it unchanged."
            exit 0
          fi
          gh release create "v${RELEASE_VERSION}" \
            --target "$RELEASE_COMMIT" \
            --title "MinecraftZombies ${RELEASE_VERSION}" \
            --notes-file RELEASE_NOTES.md \
            "Core/build/libs/MinecraftZombies-${RELEASE_VERSION}.jar" \
            Core/build/libs/SHA256SUMS.txt
