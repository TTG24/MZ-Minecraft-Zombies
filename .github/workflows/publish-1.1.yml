name: Publish MinecraftZombies 1.1

on:
  push:
    branches: [main]
    paths:
      - RELEASE_NOTES.md
      - .github/workflows/publish-1.1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-minecraftzombies-1.1
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'TTG24/MZ-Minecraft-Zombies' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check release version
        run: grep -Eq "version = '1.1'" build.gradle
      - name: Build
        run: bash ./gradlew --no-daemon build
      - name: Prepare checksum
        working-directory: Core/build/libs
        run: sha256sum MinecraftZombies-1.1.jar > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          if gh release view v1.1 >/dev/null 2>&1; then
            echo 'Release v1.1 already exists; leaving it unchanged.'
            exit 0
          fi
          gh release create v1.1 \
            --target "$RELEASE_COMMIT" \
            --title 'MinecraftZombies 1.1' \
            --notes-file RELEASE_NOTES.md \
            Core/build/libs/MinecraftZombies-1.1.jar \
            Core/build/libs/SHA256SUMS.txt
