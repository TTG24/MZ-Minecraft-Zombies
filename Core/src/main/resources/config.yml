config:
  instances:
    #Maximum volume of the two-corner map snapshot (including air), captured once per template.
    maxCopyBlocks: 5000000
    #Allow players to spin up a private single-player arena with /zombies solo <arena>.
    #The copy is created on demand and destroyed the moment nobody is left in it.
    soloInstances: true
  perks:
    maxPerks: 4
    #Juggernog health multiplier (2.5 -> 250 equivalent of COD)
    juggernogHealth: 2.5
  gameSettings:
    #Range to allow knife attacks. (Values over 6 are set to 6, the vanilla value.)
    MeleeRange: 2
    #Have all or only one Mystery Box be spawned at a time
    MultipleMysteryBoxes: false
    #Double points length in seconds
    doublePointsTimer: 30
    #Insta kill lenght in seconds
    instaKillTimer: 30
    #Insta kill lenght in seconds
    fireSaleTimer: 30
    #Time perks will stay on the ground in seconds
    perkLife: 15
    #Gun Reload time in seconds
    reloadTime: 3
    #Points a player starts with when they join a game
    startingPoints: 500
    #Whether players join a game wearing starting armor
    startingArmor: true
    #Last round a new player may join a running lobby-less (instant start) match, so late
    #arrivals can drop in instead of waiting for the next match. 0 disables late joins.
    lateJoinRound: 5
    #Armor material for each slot when startingArmor is true. Set a slot to "none" for no armor there.
    #Any valid armor material works (e.g. CHAINMAIL_BOOTS, IRON_LEGGINGS, TURTLE_HELMET, DIAMOND_CHESTPLATE, NETHERITE_BOOTS).
    startingArmorMaterials:
      helmet: LEATHER_HELMET
      chestplate: LEATHER_CHESTPLATE
      leggings: LEATHER_LEGGINGS
      boots: LEATHER_BOOTS
    #Default points when you hit a zombie, value * 2 on double points
    defaultPointsOnHit: 10
    #Default points when you kill a zombie, value * 2 on double points
    defaultPointsOnKill: 60
    #Max possible zombies in an arena at once
    maxZombies: 20
    #This is the amount to change the zombieSpawnDelay per round. Equation is zombieSpawnDelayFactor / zombieSpawnDelayFactor
    zombieSpawnDelayFactor: 1.05
    #Interval between zombies spawning, value decreases as rounds go up. This value is rounded down and is # of seconds.
    zombieSpawnDelay: 7
    #Time it takes for an arena to start
    arenaStartTime: 60
    #Apply Scope when zooming in if textured
    ZoomTexture: false
    #Change the volume of the round sound
    roundSoundVolume: 0.2
    #Volume for the bundled round music stingers (mz:round_start / mz:round_end /
    #mz:game_over), which are delivered through a server resource pack - see the
    #resourcepack/ folder and README. 0 disables the music.
    roundMusicVolume: 1.0
    #Seconds players stay in spectator mode in the arena after a match ends, so they can
    #hear the game-over stinger (and see the post-match leaderboard). 0 returns them to
    #their pre-match location immediately.
    gameOverSpectateSeconds: 30
    #The amount of damage zombies do, 9 is the equivalent 3 hits down, juggernog after the 5th hit down
    zombieDamage: 9
    #Keep arena zombies alive on Peaceful without changing world difficulty.
    #Requires Paper/Purpur with the per-mob override (works on 26.3; 26.2 clients do not support it).
    zombiesInPeaceful: true
    #The amount of seconds after being hit to be healed (standard 5)
    healTime: 5
    #Sounds the barrier plays. zombieDamage is cycled through in order; playerRepair
    #alternates pitch between hits; empty values mute a sound. Invalid names log a
    #warning and fall back to the defaults.
    barrierSounds:
      zombieDamage: [ENTITY_ZOMBIE_ATTACK_WOODEN_DOOR, ENTITY_ZOMBIE_ATTACK_IRON_DOOR]
      zombieBreak: ENTITY_ZOMBIE_BREAK_WOODEN_DOOR
      playerRepair: BLOCK_BONE_BLOCK_BREAK
  #Lets players buy a nearby door using Swap Item With Offhand (F by default).
  doorProximity:
    enabled: true
    #How close a player must be to a door (its sign or block) to see the tooltip
    radius: 3
    #Legacy display label; use interaction.key below for all nearby prompts.
    key: F
    #Customize all nearby door messages below. Use & color codes; '' hides a message.
    #Placeholders: {key} = key label, {price} = formatted cost, {missing} = points needed (no_funds).
    tooltip:
      #Shown when the door is buyable using the swap-hand key
      open: '&aPress {key} to open &7- {price} points'
      #Shown when the door needs power but the arena's power is off
      no_power: '&cRequires power &7- {price} points'
      #Shown when the player can't afford the door; {missing} is the additional points needed
      no_funds: '&cNeed {missing} more points &7- {price} points'
      #Shown when the door is already open
      already_open: '&7Door is already open.'
      #How the price is formatted inside the messages above
      price: '&e{price}'
  #Repair barriers without signs using Swap Item With Offhand (F by default).
  barrierProximity:
    enabled: true
    radius: 3
    #Customize all nearby barrier messages below. Use & color codes; '' hides a message.
    #The {key} placeholder uses the display label from interaction.key.
    tooltip:
      repair: '&aPress {key} to start repairing &7- 1 stage per second'
      repairing: '&aRepairing one stage per second &7- Press {key} to stop'
      repaired: '&aBarrier fully repaired'
  #The action is Swap Item With Offhand. Players rebind it in Minecraft Controls.
  #This label only changes prompt text; it does not change client keybindings.
  interaction:
    key: F
    #All messages support & colors, {key}, {price}, {missing}; perks also support {perk}.
    #Set any message to '' to hide it. Each feature has its own range and enable switch.
    power:
      enabled: true
      radius: 3
      tooltip:
        use: '&aPress {key} to turn on power'
        already_on: '&aPower is already on'
        unavailable: '&cPower is disabled in this arena'
    mystery_box:
      enabled: true
      radius: 3
      tooltip:
        use: '&aPress {key} to use mystery box &7- {price} points'
        pickup: '&aPress {key} to take your weapon'
        busy: '&eMystery box is busy'
        no_funds: '&cNeed {missing} more points &7- {price} points'
    perk:
      enabled: true
      radius: 3
      tooltip:
        use: '&aPress {key} to buy {perk} &7- {price} points'
        no_power: '&cRequires power &7- {price} points'
        no_funds: '&cNeed {missing} more points &7- {price} points'
        owned: '&aYou already have {perk}'
        limit: '&cPerk limit reached'
        unavailable: '&cPerk machine is unavailable'
    pack_a_punch:
      enabled: true
      radius: 3
      tooltip:
        use: '&aPress {key} to Pack-a-Punch &7- {price} points'
        no_power: '&cRequires power &7- {price} points'
        no_funds: '&cNeed {missing} more points &7- {price} points'
        no_weapon: '&eHold a gun to Pack-a-Punch &7- {price} points'
        upgraded: '&aThis gun is already Pack-a-Punched'
  #Text shown on every game sign. Each sign has 4 lines, & color codes work, and {placeholders} are filled in.
  #Any text works: signs are recognised by their location, not their text.
  #To create a sign, still type [Zombies] on line 1 and the sign type on line 2 (e.g. gun, perk, door) as before.
  signs:
    #Join signs change with the game. Placeholders: {arena} {players} {max} {wave} {alive}
    join_waiting:
      - '&c[Zombies]'
      - '&bJoin'
      - '{arena}'
      - '&aPlayers: {players}/{max}'
    join_ingame:
      - '&a{arena}'
      - '&cInProgress'
      - '&cWave: {wave}'
      - '&4Alive: {alive}'
    join_maintenance:
      - '&4[MAINTENANCE]'
      - '{arena}'
      - 'Game will be'
      - 'available soon!'
    #{arena}
    spectate:
      - '&c[Zombies]'
      - '&bSpectate'
      - '&cArena:'
      - '{arena}'
    #{kit}
    kit:
      - '&c[Zombies]'
      - '&bKit'
      - '&c{kit}'
      - ''
    #The power sign flips between these two based on whether the arena's power is on.
    power_off:
      - '&c[Zombies]'
      - '&bPower'
      - '&cOFF'
      - ''
    power_on:
      - '&c[Zombies]'
      - '&bPower'
      - '&aON'
      - ''
    #{price}
    ammo_crate:
      - '&c[Zombies]'
      - '&bAmmo Crate'
      - '{price}'
      - ''
    #{price}
    grenade:
      - '&c[Zombies]'
      - '&bGrenade'
      - '{price}'
      - ''
    #{teleporter} {price}
    teleporter:
      - '&c[Zombies]'
      - '&bTeleporter'
      - '{teleporter}'
      - '{price}'
    #{gun} {price} {refill}
    gun:
      - '&e[Zombies]'
      - '&aGun'
      - '&9{gun}'
      - '&c{price} / {refill}'
    #{perk} {price}
    perk:
      - '&c[Zombies]'
      - '&bPerk Machine'
      - '&a{perk}'
      - '&e{price}'
    #{price}
    pack_a_punch:
      - '&c[Zombies]'
      - '&5Pack-a-Punch'
      - '&6{price}'
      - ''
    #{price} (shows the fire sale price during a fire sale)
    mystery_box:
      - '&c[Zombies]'
      - '&bMystery Box'
      - '&9{price}'
      - ''
    #{price}
    door:
      - '&c[Zombies]'
      - '&6Door'
      - '&aOpen for:'
      - '&9{price}'
    #Shown on a barrier once zombies start breaking it
    barrier:
      - '[BarrierRepair]'
      - ''
      - 'Break to repair'
      - ''
  ReviveSettings:
    ReviveTimer: 4
    ReviveRange: 2
    MaxDownTime: 60
  Economy:
    CostPerJoin: 0
    MoneyPerKill: 1
