# ======================================================================================================================
#  MinecraftZombies - config.yml
#
#  Every setting is described above it. Your values are always kept: on startup and /z reload the plugin puts this file
#  back in this order with these descriptions, adds settings that are new in this version, and keeps settings it does not
#  know at the end of their section (marked). A copy of the file as it was is kept in config-backups/ first.
#
#  Colours use & codes (&a green, &c red, &e yellow, &7 grey...). Apply changes with /z reload between games (a reload
#  ends running games) or a restart.
# ======================================================================================================================

# Version of this file's layout, used to update old configs once. Don't change it.
configVersion: 2

config:

  # ---------------------------------------------------------------------------------------------------------- matches
  gameSettings:

    # ---- Joining and leaving ----
    # Points a player starts a match with.
    startingPoints: 500
    # Players join wearing the armor below.
    startingArmor: true
    # Armor for each slot while startingArmor is true. "none" leaves a slot empty. Any armor item works (e.g.
    # CHAINMAIL_BOOTS, IRON_LEGGINGS, TURTLE_HELMET, DIAMOND_CHESTPLATE, NETHERITE_BOOTS).
    startingArmorMaterials:
      helmet: LEATHER_HELMET
      chestplate: LEATHER_CHESTPLATE
      leggings: LEATHER_LEGGINGS
      boots: LEATHER_BOOTS
    # Seconds of countdown before a match with a lobby starts.
    arenaStartTime: 60
    # Last round a new player may still join a running match without a lobby (instant start). 0 = no late joins.
    lateJoinRound: 5
    # Players leaving a match (or when it ends) go to the main world's spawn. false = back where they were when they joined
    # (for joining by portal that is inside the portal, so they join again).
    leaveToSpawn: true
    # Seconds players stay as spectators in the arena after a match ends, to hear the game-over music and see the
    # leaderboard. 0 = sent back straight away.
    gameOverSpectateSeconds: 30

    # ---- Players in a match ----
    # Game mode during a match. ADVENTURE stops players breaking or placing blocks.
    playerGameMode: ADVENTURE
    # Players never get hungry during a match.
    disableHunger: true
    # Players take fall damage in arena copies (turns the fallDamage game rule on there).
    playerFallDamage: true
    # Seconds after being hit before a player starts healing (standard 5).
    healTime: 5
    # Damage a zombie hit does. 9 = down in 3 hits; with Juggernog it takes 5.
    zombieDamage: 9
    # Difficulty of the arena copies: PEACEFUL, EASY, NORMAL, HARD, or SOURCE to use the arena world's. Minecraft lets
    # zombies plan drops of about 4 blocks on Peaceful, 8 on Easy, 12 on Normal and 16 on Hard.
    instanceDifficulty: EASY
    # Keep arena zombies alive on Peaceful without changing the world's difficulty (Paper/Purpur 26.3).
    zombiesInPeaceful: true

    # ---- Points ----
    # Points for hitting a zombie (doubled during Double Points).
    defaultPointsOnHit: 10
    # Points for a body-shot kill (doubled during Double Points).
    defaultPointsOnKill: 60
    # Points for a headshot kill and for a knife kill, instead of defaultPointsOnKill (doubled during Double Points).
    pointsOnHeadshotKill: 100
    pointsOnKnifeKill: 130
    # true = every barrier pays barrierReward points per repaired stage, and /z addbarrier no longer asks for a reward.
    # false = each barrier pays the reward typed when it was made (or set with /z editbarrier: reward <n>).
    barrierRewardFromConfig: true
    barrierReward: 10

    # ---- Zombies and spawning ----
    # Most zombies alive in an arena at once.
    maxZombies: 20
    # Seconds between zombie spawns in round 1 (rounded down). It gets shorter every round.
    zombieSpawnDelay: 7
    # How much shorter the spawn delay gets each round: the delay is divided by this every round.
    zombieSpawnDelayFactor: 1.05
    # Zombies spawn at one of this many open spawn points closest to a (random) player, the closest most often. A spawn
    # on another floor counts as much farther. Higher = more spread out, lower = closer to the players.
    spawnNearestCount: 4
    # Chance (0 to 1) that a zombie spawns at ANY open spawn point instead of one near the players. 0 = nearest only.
    farSpawnChance: 0
    # A zombie that hasn't hit a player or barrier for this many seconds, and isn't near a player, respawns near a player.
    # After idleKillSeconds without a hit it is removed instead (it counts as gone for the round). 0 = off.
    idleRespawnSeconds: 30
    idleKillSeconds: 120
    # How far (in blocks) zombies and hellhounds will drop down a ledge while chasing (Minecraft's default is 3).
    zombieSafeFallDistance: 16
    # Zombies and hellhounds take fall damage.
    zombieFallDamage: false

    # ---- Barriers ----
    # How far (in blocks) a new zombie looks for a barrier to break. It goes to the nearest one in range and breaks it
    # before hunting players; with none in range (or the nearest already broken) it goes for the players.
    barrierSeekRange: 30
    # Zombies only pick a barrier at their own height, give or take this many blocks. With none at their height, every
    # barrier counts. -1 = no height check.
    barrierHeightTolerance: 2
    # How close (in blocks) a player must be for a zombie at a barrier to hit them through it. 0 = never.
    barrierAttackRange: 2.2
    # Barrier sounds. zombieDamage and playerRepair are on/off switches (any entry = on, empty list = muted): the clips
    # themselves come from the server resource pack (mz:zombie_damage, mz:repair), so players without it hear nothing.
    # zombieBreak is a vanilla sound name. Invalid names log a warning and use the defaults.
    barrierSounds:
      zombieDamage: [ENTITY_ZOMBIE_ATTACK_WOODEN_DOOR, ENTITY_ZOMBIE_ATTACK_IRON_DOOR]
      zombieBreak: ENTITY_ZOMBIE_BREAK_WOODEN_DOOR
      playerRepair: BLOCK_BONE_BLOCK_BREAK

    # ---- Weapons, power-ups and the mystery box ----
    # Knife reach in blocks (at most 6, the vanilla reach).
    MeleeRange: 2
    # Seconds a gun takes to reload.
    reloadTime: 3
    # Show a scope overlay when zooming with a sniper rifle (needs a resource pack with the scope texture).
    ZoomTexture: false
    # Seconds Double Points, Insta-Kill and Fire Sale last.
    doublePointsTimer: 30
    instaKillTimer: 30
    fireSaleTimer: 30
    # Seconds a dropped power-up stays on the ground.
    perkLife: 15
    # true = every mystery box location is active at once. false = one box at a time, moving around.
    MultipleMysteryBoxes: false
    # Height in blocks of the light beam above the active mystery box. 0 = no beam.
    boxBeaconHeight: 40
    # Perk machine signs disappear once set up (perks are still bought with the interact key). /z perksigns <arena>
    # show|hide puts them back or removes them; other signs: /z signs.
    hidePerkSigns: true

    # ---- Teleporters ----
    # Seconds to link a teleporter pad (sign with "pad" on line 2) at the mainframe after activating it. Once every pad
    # is linked, doors made with LINK open (the way to Pack-a-Punch, like Der Riese).
    teleporterLinkTime: 30
    # Seconds before a teleporter (sign or link region) can be used again. 0 = no cooldown.
    teleporterCooldown: 0
    # Points to teleport from a linked link region (/z linkadd). Whoever presses the key pays; everyone in it goes.
    linkTeleportCost: 1500
    # Link regions teleport to the mainframe. true = /z linkdest can send a link to another link instead.
    linksToLinks: false
    # false = press the interact key in a link region to activate it, and at the mainframe to link it.
    # true = standing in them is enough.
    linkAutoActivate: false

    # ---- Sound and music ----
    # Volume of the built-in round sound.
    roundSoundVolume: 0.2
    # Volume of the round start/end and game-over music from the server resource pack (mz:round_start, mz:round_end,
    # mz:game_over). 0 = off.
    roundMusicVolume: 1.0
    # Volume of the ambient track played once when a match starts (mz:ambient, same pack). 0 = off.
    ambientMusicVolume: 1.0
    # A hurt sound plays when a hit leaves a player at or below this percent of their health. 0 = off.
    hurtSoundPercent: 30

    # ---- Dolphin dive ----
    # Sneak + jump during a match thrusts you forward, then holds a low posture for a moment.
    diveEnabled: true
    # Seconds between dives.
    diveCooldownSeconds: 2.0
    # Thrust speed in blocks per tick (0.4 is a solid burst).
    diveLungeStrength: 0.4
    # Seconds the low posture lasts.
    diveDurationSeconds: 1.0

  # Going down and being revived.
  ReviveSettings:
    # Seconds a teammate needs to revive a downed player.
    ReviveTimer: 4
    # How close (in blocks) a teammate must be to revive (at most 6).
    ReviveRange: 2
    # Seconds a downed player can wait before bleeding out.
    MaxDownTime: 60
    # Crawl speed while downed (0 to 0.2; vanilla walking is 0.2).
    DownedWalkSpeed: 0.1

  # Perks.
  perks:
    # Most perks one player can hold.
    maxPerks: 4
    # Health multiplier from Juggernog (2.5 = the COD 250 health).
    juggernogHealth: 2.5

  # Server money (needs Vault and an economy plugin).
  Economy:
    # Money a player gets for each zombie kill. 0 = none.
    MoneyPerKill: 1

  # ---------------------------------------------------------------------------------------------------- arena copies
  # Several matches on one arena (/z instances) and solo arenas (/z solo). Needs FastAsyncWorldEdit or WorldEdit.
  instances:
    # Largest arena (two-corner box, air included) that may be copied, in blocks.
    maxCopyBlocks: 5000000
    # Copies kept of each arena (at most the arena's instance count).
    readyCopies: 4
    # Empty copies kept ready for the next players. When one is used, another is made in the background.
    spareCopies: 1
    # A copy is pasted one slice per tick over this many ticks (60 = 3 seconds), so making one never freezes the server.
    pasteTicks: 60
    # Ticks to wait between making two copies.
    prepareIntervalTicks: 5
    # Extra copies (beyond readyCopies) left empty this long are removed.
    removeExtraAfterSeconds: 180
    # Allow /z solo <arena>: a private one-player copy, made on demand and removed as soon as it is empty.
    soloInstances: true

  # Daily zip of the worlds, plugin settings and data and server config, in backups/daily.
  backups:
    enabled: true
    # Days of backups kept.
    keepDays: 14

  # ---------------------------------------------------------------------------------------------- press-F prompts
  # Doors, barriers and machines are used with Swap Item With Offhand (F by default) from close by, with a prompt.
  # Messages use & colours; '' hides a message. Placeholders: {key} = the key label, {price} = the cost,
  # {missing} = points still needed, {perk} / {gun} / {destination} where shown.
  interaction:
    # The key name shown in prompts. It only changes the text: players rebind the key in Minecraft's Controls.
    key: F
    # Where prompts appear: 'subtitle' (higher up, clear of the stamina bar) or 'actionbar' (just above the hotbar).
    promptPosition: subtitle
    # Prompt font. 'mz:small' is the smaller font from the server resource pack (only for players who loaded a pack);
    # '' = the normal Minecraft font.
    promptFont: 'mz:small'
    # Each machine below: enabled = whether the key works there, radius = blocks of space between the player and it.
    power:
      enabled: true
      radius: 1
      tooltip:
        use: '&aPress {key} to turn on power'
        already_on: '&aPower is already on'
        unavailable: '&cPower is disabled in this arena'
    mystery_box:
      enabled: true
      radius: 1
      tooltip:
        use: '&aPress {key} to use mystery box &7- {price} points'
        pickup: '&aPress {key} to take your weapon'
        busy: '&eMystery box is busy'
        no_funds: '&cNeed {missing} more points &7- {price} points'
    perk:
      enabled: true
      radius: 1
      tooltip:
        use: '&aPress {key} to buy {perk} &7- {price} points'
        no_power: '&cRequires power &7- {price} points'
        no_funds: '&cNeed {missing} more points &7- {price} points'
        owned: '&aYou already have {perk}'
        limit: '&cPerk limit reached'
        unavailable: '&cPerk machine is unavailable'
    # Gun signs: buy the gun, or refill its ammo if you already have it.
    gun:
      enabled: true
      radius: 1
      tooltip:
        use: '&aPress {key} to buy {gun} &7- {price} points'
        refill: '&aPress {key} to refill ammo &7- {price} points'
        no_funds: '&cNeed {missing} more points &7- {price} points'
    teleporter:
      enabled: true
      radius: 1
      tooltip:
        use: '&aPress {key} to teleport &7- {price} points'
        activate: '&bPress {key} to activate the teleporter'
        no_power: '&cRequires power'
        no_funds: '&cNeed {missing} more points &7- {price} points'
    mainframe:
      enabled: true
      radius: 1
    # Standing in a teleporter link region (/z linkadd).
    link:
      tooltip:
        use: '&aPress {key} to teleport to {destination} &7- {price} points'
        no_funds: '&cNeed {missing} more points &7- {price} points'
        no_power: '&cRequires power'
    pack_a_punch:
      enabled: true
      radius: 1
      tooltip:
        use: '&aPress {key} to Pack-a-Punch &7- {price} points'
        no_power: '&cRequires power &7- {price} points'
        no_funds: '&cNeed {missing} more points &7- {price} points'
        no_weapon: '&eHold a gun to Pack-a-Punch &7- {price} points'
        upgraded: '&aThis gun is already Pack-a-Punched'

  # Buying doors with the interact key.
  doorProximity:
    enabled: true
    # Blocks of space between the player and the door (its sign or blocks) for the prompt to show.
    radius: 1
    # Old key label, only used when interaction.key is missing.
    key: F
    tooltip:
      # The door can be bought.
      open: '&aPress {key} to open &7- {price} points'
      # The door needs power and the power is off.
      no_power: '&cRequires power &7- {price} points'
      # Not enough points; {missing} = points still needed.
      no_funds: '&cNeed {missing} more points &7- {price} points'
      # The door is already open.
      already_open: '&7Door is already open.'
      # How {price} looks inside the messages above.
      price: '&e{price}'

  # Repairing barriers with the interact key (one stage per second, press again or walk away to stop).
  barrierProximity:
    enabled: true
    # Blocks of space between the player and the barrier for the prompt to show.
    radius: 1
    tooltip:
      repair: '&aPress {key} to start repairing &7- 1 stage per second'
      repairing: '&aRepairing one stage per second &7- Press {key} to stop'
      repaired: '&aBarrier fully repaired'

  # ---------------------------------------------------------------------------------------------------------- signs
  # The text on every game sign: 4 lines each, & colours and {placeholders} work. Signs are recognised by their
  # location, so the text can be anything. To make a sign, still write [Zombies] on line 1 and the type on line 2
  # (gun, perk, door...).
  signs:
    # Join signs change with the game. {arena} {players} {max} {wave} {alive}
    join_waiting:
      - '&c[Zombies]'
      - '&bJoin'
      - '{arena}'
      - '&aPlayers: {players}/{max}'
    join_ingame:
      - '&a{arena}'
      - '&cInProgress'
      - '&cWave: {wave}'
      - '&4Alive: {alive}'
    join_maintenance:
      - '&4[MAINTENANCE]'
      - '{arena}'
      - 'Game will be'
      - 'available soon!'
    # {arena}
    spectate:
      - '&c[Zombies]'
      - '&bSpectate'
      - '&cArena:'
      - '{arena}'
    # {kit}
    kit:
      - '&c[Zombies]'
      - '&bKit'
      - '&c{kit}'
      - ''
    # The power sign switches between these two.
    power_off:
      - '&c[Zombies]'
      - '&bPower'
      - '&cOFF'
      - ''
    power_on:
      - '&c[Zombies]'
      - '&bPower'
      - '&aON'
      - ''
    # {price}
    ammo_crate:
      - '&c[Zombies]'
      - '&bAmmo Crate'
      - '{price}'
      - ''
    # {price}
    grenade:
      - '&c[Zombies]'
      - '&bGrenade'
      - '{price}'
      - ''
    mainframe:
      - '&c[Zombies]'
      - '&bMainframe'
      - '&7Link teleporters'
      - ''
    # {teleporter} {price}
    teleporter:
      - '&c[Zombies]'
      - '&bTeleporter'
      - '{teleporter}'
      - '{price}'
    # {gun} {price} {refill}
    gun:
      - '&e[Zombies]'
      - '&aGun'
      - '&9{gun}'
      - '&c{price} / {refill}'
    # {perk} {price}
    perk:
      - '&c[Zombies]'
      - '&bPerk Machine'
      - '&a{perk}'
      - '&e{price}'
    # {price}
    pack_a_punch:
      - '&c[Zombies]'
      - '&5Pack-a-Punch'
      - '&6{price}'
      - ''
    # {price} (the fire sale price during a fire sale)
    mystery_box:
      - '&c[Zombies]'
      - '&bMystery Box'
      - '&9{price}'
      - ''
    # {price}
    door:
      - '&c[Zombies]'
      - '&6Door'
      - '&aOpen for:'
      - '&9{price}'
    # Shown on a barrier once zombies start breaking it.
    barrier:
      - '[BarrierRepair]'
      - ''
      - 'Break to repair'
      - ''

# Points the plugin saves for players. Written by the plugin.
Players: {}
