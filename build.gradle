allprojects {
    group = 'comz'
    version = '1.3.1'
}

subprojects {
    apply plugin: 'java'

    // Paper 26.x API and the runtime server both require Java 25. The Gradle
    // daemon can stay on JDK 21; the toolchain routes javac to the installed JDK 25.
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    repositories {
        mavenLocal()
    }
}

tasks.withType(JavaCompile).configureEach {
    //Ignore Java 8 warnings. Not much I can do here
    options.compilerArgs += ['-Xlint:deprecation']
}
