# JVM toolchain (Java 25) is resolved automatically on every machine/CI via the
# Foojay resolver plugin in settings.gradle. Do NOT hardcode a JDK install path
# here: a machine-specific path (e.g. a Windows one) breaks builds everywhere else.
# To prefer a local JDK 25 install on your own machine, put that path in the
# USER-level properties file (~/.gradle/gradle.properties), which is never committed.
org.gradle.jvmargs=-Xmx2g
